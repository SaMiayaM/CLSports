<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CL Sports Club</title>
<style>
  :root{
    --red:#e60d18;
    --bg1:#0a0a0d;
    --bg2:#16171c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg1);font-family:'Segoe UI',Arial,sans-serif;}

  /* ---------- Cinematic Stage ---------- */
  .stage{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, #22242c 0%, var(--bg2) 45%, var(--bg1) 100%);
    perspective:1400px;
    z-index:50;
    transition:opacity 1s ease;
  }
  /* subtle moving spotlight */
  .stage::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 45%, rgba(230,13,24,.18), transparent 55%);
    animation:pulseGlow 4s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulseGlow{0%,100%{opacity:.4;}50%{opacity:1;}}

  /* film grain / vignette */
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,.9);
  }

  /* ---------- Logo assembly ---------- */
  .logo-wrap{
    position:relative;
    width:min(70vw,520px);
    aspect-ratio:1/1;
    transform-style:preserve-3d;
  }
  .layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0;
  }

  /* Each layer is one of your PNG variations.
     Replace the url() paths with your actual filenames. */
  .mono-black{ background-image:url('logo-black-red.png'); }   /* black C / red L */
  .mono-red  { background-image:url('logo-red-black.png'); }   /* red C / black L */
  .mono-full { background-image:url('logo-red.png'); }          /* solid red monogram */
  .wordmark  { background-image:url('logo-wordmark.png'); }     /* SPORTS CLUB text */

  /* --- Animation timeline --- */

  /* 1. Black-half version slides in from LEFT, tilted */
  .mono-black{
    animation:flyLeft 1.1s cubic-bezier(.19,1,.22,1) .3s forwards;
  }
  @keyframes flyLeft{
    0%  {opacity:0;transform:translateX(-120%) rotateY(-70deg) scale(1.3);}
    60% {opacity:1;}
    100%{opacity:1;transform:translateX(0) rotateY(0) scale(1);}
  }

  /* 2. Red-half version slides in from RIGHT, then fades to reveal below */
  .mono-red{
    animation:flyRight 1.1s cubic-bezier(.19,1,.22,1) .5s forwards,
              handoff .5s ease 2.1s forwards;
  }
  @keyframes flyRight{
    0%  {opacity:0;transform:translateX(120%) rotateY(70deg) scale(1.3);}
    60% {opacity:1;}
    100%{opacity:1;transform:translateX(0) rotateY(0) scale(1);}
  }
  @keyframes handoff{to{opacity:0;}}

  /* also fade the black one out at handoff */
  .mono-black{ animation:flyLeft 1.1s cubic-bezier(.19,1,.22,1) .3s forwards,
                          handoff .5s ease 2.1s forwards;}

  /* 3. Solid red monogram flashes into place (the unified mark) */
  .mono-full{
    animation:snapReveal 1s cubic-bezier(.16,1,.3,1) 2.3s forwards;
    filter:drop-shadow(0 0 0 rgba(230,13,24,0));
  }
  @keyframes snapReveal{
    0%  {opacity:0;transform:scale(1.15);filter:drop-shadow(0 0 30px rgba(230,13,24,.9)) brightness(2);}
    40% {opacity:1;transform:scale(.97);}
    100%{opacity:1;transform:scale(1);filter:drop-shadow(0 8px 24px rgba(230,13,24,.35)) brightness(1);}
  }

  /* 4. Wordmark rises up under the monogram */
  .wordmark{
    animation:riseUp 1s ease 3.1s forwards;
  }
  @keyframes riseUp{
    0%  {opacity:0;transform:translateY(18%);}
    100%{opacity:1;transform:translateY(0);}
  }

  /* white light sweep across the finished logo */
  .sweep{
    position:absolute;inset:0;overflow:hidden;border-radius:12px;
    pointer-events:none;
  }
  .sweep::before{
    content:"";position:absolute;top:-50%;left:-60%;
    width:40%;height:200%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg);
    animation:shine 1.2s ease 3.4s forwards;
    opacity:0;
  }
  @keyframes shine{
    0%{left:-60%;opacity:1;}
    100%{left:130%;opacity:1;}
  }

  /* tagline fade in */
  .tagline{
    position:absolute;bottom:14%;left:0;right:0;text-align:center;
    color:#fff;letter-spacing:.5em;font-size:clamp(.6rem,1.6vw,1rem);
    text-transform:uppercase;opacity:0;
    animation:fadeIn 1s ease 4s forwards;
  }
  @keyframes fadeIn{to{opacity:.8;}}

  /* skip button */
  .skip{
    position:fixed;bottom:24px;right:24px;z-index:60;
    background:transparent;border:1px solid rgba(255,255,255,.35);
    color:rgba(255,255,255,.7);padding:8px 18px;border-radius:30px;
    font-size:.8rem;letter-spacing:.15em;cursor:pointer;text-transform:uppercase;
    transition:.3s;
  }
  .skip:hover{background:var(--red);border-color:var(--red);color:#fff;}

  /* ---------- Landing content revealed after intro ---------- */
  .site{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    color:#fff;opacity:0;pointer-events:none;transition:opacity 1s ease .3s;
    background:radial-gradient(ellipse at 50% 30%,#1c1d24,#0a0a0d);
  }
  .site.show{opacity:1;pointer-events:auto;}
  .site .brand{width:min(46vw,300px);aspect-ratio:1/1;
    background:url('logo-red.png') center/contain no-repeat;
    margin-bottom:8px;}
  .site .word{width:min(46vw,300px);height:60px;
    background:url('logo-wordmark.png') center/contain no-repeat;margin-bottom:30px;}
  .site h1{font-size:clamp(1.4rem,4vw,2.6rem);font-weight:800;letter-spacing:.04em;}
  .site h1 span{color:var(--red);}
  .site p{max-width:520px;margin:14px 20px 30px;color:#b9bcc6;line-height:1.6;}
  .cta{background:var(--red);color:#fff;border:none;padding:14px 34px;border-radius:40px;
    font-size:1rem;font-weight:700;letter-spacing:.05em;cursor:pointer;
    box-shadow:0 8px 30px rgba(230,13,24,.4);transition:.25s;}
  .cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(230,13,24,.6);}

  .fadeStage{opacity:0!important;pointer-events:none;}
</style>
</head>
<body>

  <!-- CINEMATIC INTRO -->
  <div class="stage" id="stage">
    <div class="logo-wrap">
      <div class="layer mono-black"></div>
      <div class="layer mono-red"></div>
      <div class="layer mono-full"></div>
      <div class="layer wordmark"></div>
      <div class="sweep"></div>
    </div>
    <div class="tagline">Precision · Power · Performance</div>
  </div>
  <button class="skip" id="skip">Skip Intro ▸</button>

  <!-- MAIN SITE -->
  <div class="site" id="site">
    <div class="brand"></div>
    <div class="word"></div>
    <h1>Welcome to <span>CL Sports Club</span></h1>
    <p>Where athletes are forged. Train harder, play smarter, and become part
       of a community built on relentless dedication.</p>
    <button class="cta">Join the Club</button>
  </div>

<script>
  const stage = document.getElementById('stage');
  const site  = document.getElementById('site');
  const skip  = document.getElementById('skip');

  const REVEAL_TIME = 5200; // ms — end of full animation

  function endIntro(){
    stage.classList.add('fadeStage');
    skip.style.display='none';
    site.classList.add('show');
  }

  const timer = setTimeout(endIntro, REVEAL_TIME);
  skip.addEventListener('click', ()=>{clearTimeout(timer); endIntro();});
</script>
</body>
</html>
